<!DOCTYPE html>
<html>
<head>
  <title>Sticker Pin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Sticker Pin</h1>
    <div class="upload-container">
      <input type="file" id="fileInput" accept="image/*,.gif" style="display: none;">
      <button id="uploadButton" class="upload-button">Upload Image/GIF</button>
      <p class="upload-info">Supports JPG, PNG, and GIF files (max 5MB)</p>
    </div>
    <div class="stored-images-container">
      <h2>Stored Images</h2>
      <div id="storedImages" class="stored-images-grid"></div>
    </div>
  </div>
  <script src="storageService.js"></script>
  <script src="imageService.js"></script>
  <script src="popup.js"></script>
</body>
</html>
